<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>แคตตาล็อกสินค้า</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <h1>แคตตาล็อกสินค้า</h1>
      <p>เลือกดูสินค้าตามหมวดหมู่ที่ต้องการ</p>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <h2>หมวดหมู่</h2>
        <ul id="category-list" class="category-list"></ul>
      </aside>
      <section class="content">
        <div class="toolbar">
          <label for="search-input">ค้นหา:</label>
          <input type="search" id="search-input" placeholder="พิมพ์ชื่อสินค้า..." />
        </div>
        <div id="product-grid" class="product-grid"></div>
        <div id="status" class="status" role="status" aria-live="polite"></div>
      </section>
    </main>

    <template id="product-card-template">
      <article class="product-card">
        <div class="product-image-wrapper">
          <img class="product-image" alt="" loading="lazy" />
        </div>
        <div class="product-info">
          <h3 class="product-title"></h3>
          <p class="product-description"></p>
          <p class="product-price"></p>
          <span class="product-category"></span>
        </div>
      </article>
    </template>

    <script src="/app.js" defer></script>
  </body>
</html>
